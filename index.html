<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Advinced Management</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root,[data-theme="light"]{
  --brand:#006AD2;--brand-press:#0057B0;--brand-soft:rgba(0,106,210,.08);--brand-line:rgba(0,106,210,.18);
  --bg:#F2F5F9;--surface:#FFF;--text:#0F172A;--text2:#475569;--hint:#94A3B8;--line:#E2E8F0;
  --danger:#DC2626;--ok:#059669;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.04);
  --radius:12px;--btn-p:#FFF;--header-h:52px;
}
[data-theme="dark"]{
  --brand:#FFF;--brand-press:#E8EEF7;--brand-soft:rgba(255,255,255,.1);--brand-line:rgba(255,255,255,.22);
  --bg:#003F8A;--surface:#0056B8;--text:#FFF;--text2:rgba(255,255,255,.78);--hint:rgba(255,255,255,.55);
  --line:rgba(255,255,255,.16);--danger:#FCA5A5;--ok:#6EE7B7;
  --shadow:0 1px 2px rgba(0,0,0,.18),0 4px 14px rgba(0,0,0,.16);--btn-p:#006AD2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:0 0 env(safe-area-inset-bottom,0)}

/* TOPBAR fixed */
.topbar{position:sticky;top:0;z-index:50;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-left,.topbar-right{display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow)}
.icon-btn:active{opacity:.8}
.icon-btn svg{width:18px;height:18px}
.lang-btn{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px;cursor:pointer;box-shadow:var(--shadow);line-height:1}
.bal-chip{height:32px;padding:0 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:700;display:flex;align-items:center;gap:3px;cursor:pointer;box-shadow:var(--shadow)}
.bal-chip .cur{font-size:11px;font-weight:600;color:var(--hint)}
.avatar{width:36px;height:36px;border-radius:50%;border:2px solid var(--brand-line);background:var(--brand-soft);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--brand);box-shadow:var(--shadow)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.back-btn{height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);display:none}
.back-btn.show{display:inline-flex;align-items:center}

.content{flex:1;display:flex;flex-direction:column;padding:12px 16px 20px;min-height:0}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.active{display:flex}
.spacer{flex:1;min-height:8px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);min-height:48px;padding:12px 14px;border-radius:var(--radius);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow)}
.btn:active{transform:scale(.985);filter:brightness(.97)}
.btn.wide{grid-column:1/-1}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--btn-p)}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--brand-line);color:var(--brand)}
.btn:disabled{opacity:.45}

/* square tiles 2-col */
.tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{aspect-ratio:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;box-shadow:var(--shadow);gap:6px}
.tile:active{opacity:.85}
.tile .t-title{font-size:15px;font-weight:700;color:var(--text)}
.tile .t-sub{font-size:12px;font-weight:500;color:var(--hint);line-height:1.3}
.tile.wide{grid-column:1/-1;aspect-ratio:auto;min-height:72px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.panel h1{font-size:18px;font-weight:700;margin-bottom:8px;letter-spacing:-.02em}
.panel h2{font-size:12px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.muted{color:var(--text2);font-size:14px;line-height:1.45}
.hint{color:var(--hint);font-size:13px}
.balance-big{font-size:32px;font-weight:700;letter-spacing:-.03em;margin:6px 0}
.balance-big span{font-size:16px;font-weight:600;color:var(--text2);margin-left:4px}

.lang-list,.theme-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.lang-item,.theme-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:600;color:var(--text);box-shadow:var(--shadow)}
.lang-item:active,.theme-item:active{opacity:.85}
.lang-item.active,.theme-item.active{border-color:var(--brand);background:var(--brand-soft)}
.lang-item .flag{font-size:18px;width:28px;text-align:center}
.badge-orig{margin-left:auto;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;border:1px solid var(--brand-line);color:var(--brand);background:var(--brand-soft);white-space:nowrap}

.list{display:grid;gap:8px;margin:8px 0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);cursor:pointer}
.item .name{font-size:15px;font-weight:600}
.item .sub{margin-top:4px;font-size:12px;color:var(--hint);font-weight:500}
.empty{text-align:center;padding:24px;color:var(--hint);font-size:14px;font-weight:500}

.field{padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:none}
.field .label{font-size:12px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.field .value{font-size:15px;font-weight:600}
.form-input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font-size:16px;outline:none;margin-bottom:10px}
.form-input:focus{border-color:var(--brand)}
.form-label{display:block;font-size:13px;color:var(--hint);margin-bottom:6px}

.profile-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 0 8px}
.avatar-lg{width:72px;height:72px;border-radius:50%;border:2px solid var(--brand-line);overflow:hidden;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--brand);margin-bottom:10px}
.avatar-lg img{width:100%;height:100%;object-fit:cover}
.profile-name{font-size:18px;font-weight:700}
.profile-uname{margin-top:4px;font-size:14px;font-weight:600;color:var(--brand);cursor:pointer;text-decoration:none}
.profile-uname:active{opacity:.8}

.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-pending{background:rgba(255,149,0,.15);color:#ff9500}
.badge-completed{background:rgba(5,150,105,.12);color:var(--ok)}
.badge-cancelled{background:rgba(220,38,38,.12);color:var(--danger)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <button type="button" class="icon-btn" id="btn-gear" aria-label="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <div class="topbar-right">
      <button type="button" class="back-btn" id="btn-back" data-i18n="back">Назад</button>
      <button type="button" class="lang-btn" id="btn-flag">🇷🇺</button>
      <button type="button" class="bal-chip" id="btn-top-bal"><span id="top-bal">—</span><span class="cur">₽</span></button>
      <button type="button" class="avatar" id="btn-avatar"><span id="av-fb">A</span><img id="av-img" alt="" style="display:none"/></button>
    </div>
  </div>

  <div class="content">
    <!-- MAIN -->
    <div id="screen-main" class="screen active">
      <div class="spacer"></div>
      <div class="actions" id="main-actions">
        <button class="btn" data-nav="balance" data-i18n="balance">Баланс</button>
        <button class="btn" data-nav="settings" data-i18n="settings">Настройки</button>
        <button class="btn primary wide" data-nav="projects" data-i18n="projects">Проекты</button>
        <button class="btn" data-nav="help" data-i18n="help">Помощь</button>
        <button class="btn" data-nav="support" data-i18n="support">Поддержка</button>
        <button class="btn ghost wide" data-nav="panel" id="btn-panel" style="display:none" data-i18n="panel">Панель</button>
      </div>
    </div>

    <!-- SETTINGS: 2 squares -->
    <div id="screen-settings" class="screen">
      <div class="panel"><h1 data-i18n="settings">Настройки</h1></div>
      <div class="tile-grid">
        <button type="button" class="tile" id="tile-lang">
          <div class="t-title" data-i18n="language">Язык</div>
          <div class="t-sub" id="tile-lang-sub">🇷🇺 Русский</div>
        </button>
        <button type="button" class="tile" id="tile-theme">
          <div class="t-title" data-i18n="theme">Тема</div>
          <div class="t-sub" id="tile-theme-sub">Светлая</div>
        </button>
      </div>
    </div>

    <!-- LANGUAGE -->
    <div id="screen-lang" class="screen">
      <div class="panel"><h1 data-i18n="language">Язык</h1></div>
      <div class="lang-list" id="lang-list"></div>
    </div>

    <!-- THEME -->
    <div id="screen-theme" class="screen">
      <div class="panel"><h1 data-i18n="theme">Тема</h1></div>
      <div class="theme-list">
        <button type="button" class="theme-item" data-theme-set="auto"><span data-i18n="theme_auto">Как в Telegram</span></button>
        <button type="button" class="theme-item" data-theme-set="light"><span data-i18n="theme_light">Светлая</span></button>
        <button type="button" class="theme-item" data-theme-set="dark"><span data-i18n="theme_dark">Тёмная</span></button>
      </div>
    </div>

    <!-- PROFILE -->
    <div id="screen-profile" class="screen">
      <div class="panel">
        <div class="profile-wrap">
          <div class="avatar-lg" id="p-av"><span id="p-av-fb">A</span><img id="p-av-img" style="display:none" alt=""/></div>
          <div class="profile-name" id="p-name">—</div>
          <a class="profile-uname" id="p-uname" href="#" target="_blank" rel="noopener">—</a>
        </div>
        <div class="field"><div class="label">ID</div><div class="value" id="p-id">—</div></div>
        <div class="field"><div class="label" data-i18n="role">Роль</div><div class="value" id="p-role">—</div></div>
        <div class="field"><div class="label" data-i18n="balance">Баланс</div><div class="value" id="p-bal">— ₽</div></div>
      </div>
    </div>

    <!-- BALANCE -->
    <div id="screen-balance" class="screen">
      <div class="panel">
        <h2 data-i18n="balance">Баланс</h2>
        <div class="balance-big" id="bal-big">—<span>₽</span></div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btn-deposit" data-i18n="deposit">Пополнение</button>
        <button class="btn" id="btn-withdraw" data-i18n="withdraw">Вывод</button>
      </div>
      <div class="panel" style="margin-top:12px">
        <h2 data-i18n="my_requests">Мои заявки</h2>
        <div class="list" id="req-list"><div class="empty" data-i18n="no_requests">Нет заявок</div></div>
      </div>
    </div>

    <!-- DEPOSIT -->
    <div id="screen-deposit" class="screen">
      <div class="panel"><h1 data-i18n="deposit">Пополнение</h1>
        <label class="form-label" data-i18n="amount">Сумма (₽)</label>
        <input class="form-input" id="dep-amount" type="number" min="1" step="1" placeholder="100"/>
        <label class="form-label" data-i18n="method">Способ</label>
        <div class="btn-row">
          <button class="btn primary" data-dep-method="sbp">СБП</button>
          <button class="btn" data-dep-method="crypto">Crypto</button>
        </div>
        <label class="form-label" data-i18n="comment">Комментарий</label>
        <input class="form-input" id="dep-comment" type="text" placeholder="—"/>
        <button class="btn primary wide" id="dep-submit" style="margin-top:8px" data-i18n="create_request">Создать заявку</button>
        <div class="muted" id="dep-info" style="margin-top:10px"></div>
      </div>
    </div>

    <!-- WITHDRAW -->
    <div id="screen-withdraw" class="screen">
      <div class="panel"><h1 data-i18n="withdraw">Вывод</h1>
        <label class="form-label" data-i18n="amount">Сумма (₽)</label>
        <input class="form-input" id="wd-amount" type="number" min="5" step="1" placeholder="100"/>
        <label class="form-label" data-i18n="method">Способ</label>
        <div class="btn-row">
          <button class="btn primary" data-wd-method="sbp">СБП</button>
          <button class="btn" data-wd-method="crypto">Crypto</button>
        </div>
        <label class="form-label" data-i18n="recipient">Реквизиты</label>
        <input class="form-input" id="wd-recipient" type="text" placeholder="карта / кошелёк"/>
        <label class="form-label" data-i18n="recipient_name">Получатель</label>
        <input class="form-input" id="wd-name" type="text" placeholder="Иванов И.И."/>
        <button class="btn primary wide" id="wd-submit" style="margin-top:8px" data-i18n="create_request">Создать заявку</button>
        <div class="muted" id="wd-info" style="margin-top:10px"></div>
      </div>
    </div>

    <!-- PROJECTS -->
    <div id="screen-projects" class="screen">
      <div class="panel"><h1 data-i18n="projects">Проекты</h1><div class="hint" id="proj-meta">—</div></div>
      <div class="list" id="proj-list"></div>
      <div class="btn-row">
        <button class="btn" id="proj-prev" data-i18n="prev">Назад</button>
        <button class="btn" id="proj-next" data-i18n="next">Вперёд</button>
      </div>
    </div>

    <div id="screen-project" class="screen">
      <div class="panel"><h1 id="pd-title">—</h1><div class="muted" id="pd-body">—</div></div>
    </div>

    <!-- HELP -->
    <div id="screen-help" class="screen">
      <div class="panel"><h1 data-i18n="help">Помощь</h1>
        <p class="muted" data-i18n="help_body">Mini App синхронизирован с ботом. Баланс и проекты загружаются с сервера.</p>
      </div>
    </div>

    <!-- SUPPORT tiles -->
    <div id="screen-support" class="screen">
      <div class="panel"><h1 data-i18n="support">Поддержка</h1></div>
      <div class="tile-grid">
        <button type="button" class="tile"><div class="t-title" data-i18n="support_manager">Менеджер</div><div class="t-sub" data-i18n="soon">Скоро</div></button>
        <button type="button" class="tile"><div class="t-title" data-i18n="support_bot">Бот</div><div class="t-sub" data-i18n="soon">Скоро</div></button>
        <button type="button" class="tile"><div class="t-title" data-i18n="support_email">Почта</div><div class="t-sub" data-i18n="soon">Скоро</div></button>
        <button type="button" class="tile"><div class="t-title" data-i18n="support_faq">FAQ</div><div class="t-sub" data-i18n="soon">Скоро</div></button>
      </div>
    </div>

    <!-- PANEL -->
    <div id="screen-panel" class="screen">
      <div class="panel"><h1 data-i18n="panel">Панель</h1><div class="hint" id="panel-role">—</div></div>
      <div class="tile-grid" id="panel-tiles">
        <button type="button" class="tile" data-panel="staff"><div class="t-title" data-i18n="staff">Сотрудники</div></button>
        <button type="button" class="tile" data-panel="mod_sell"><div class="t-title" data-i18n="mod_sell">Продажа</div></button>
        <button type="button" class="tile" data-panel="mod_buy"><div class="t-title" data-i18n="mod_buy">Покупка</div></button>
        <button type="button" class="tile" data-panel="mod_tx"><div class="t-title" data-i18n="mod_tx">Транзакции</div></button>
        <button type="button" class="tile wide" data-panel="analytics"><div class="t-title" data-i18n="analytics">Аналитика</div></button>
      </div>
      <div class="panel" id="panel-body" style="display:none"><div class="muted" data-i18n="panel_hint">Управление выполняется в боте. Данные синхронизированы по API.</div></div>
    </div>
  </div>
</div>

const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
const tgUser=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user:null;
const USER_ID=tgUser?tgUser.id:null;

let state={lang:"ru",theme:"light",history:["main"],depMethod:"sbp",wdMethod:"sbp",projPage:1,me:null};

function t(key){
  const pack=I18N[state.lang]||I18N.ru;
  const v=pack[key];
  if(v!=null)return v;
  return(I18N.en[key]!=null?I18N.en[key]:(I18N.ru[key]||key));
}
function roleName(role){
  const key=ROLE_NAMES[role]||"user";
  const pack=I18N[state.lang]||I18N.ru;
  return(pack.roles&&pack.roles[key])||key;
}
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k=el.getAttribute("data-i18n");
    el.textContent=t(k);
  });
  updateLangTile();
  updateThemeTile();
  renderLangList();
  document.querySelectorAll(".theme-item").forEach(b=>{
    b.classList.toggle("active",b.getAttribute("data-theme-set")===state.theme);
  });
}

function resolveTheme(theme){
  if(theme==="auto"){
    const cs=(tg&&tg.colorScheme)||"light";
    return cs==="dark"?"dark":"light";
  }
  return theme==="dark"?"dark":"light";
}
function applyTheme(theme,saveLocal){
  if(theme!=="auto"&&theme!=="dark")theme="light";
  // allow auto
  if(theme!=="auto"&&theme!=="dark"&&theme!=="light")theme="light";
  state.theme=theme;
  const resolved=resolveTheme(theme);
  document.documentElement.setAttribute("data-theme",resolved);
  if(saveLocal!==false){try{localStorage.setItem("advinced_theme",theme)}catch(e){}}
  if(tg){
    try{
      if(resolved==="dark"){tg.setHeaderColor("#003F8A");tg.setBackgroundColor("#003F8A")}
      else{tg.setHeaderColor("#006AD2");tg.setBackgroundColor("#F2F5F9")}
    }catch(e){}
  }
  updateThemeTile();
  document.querySelectorAll(".theme-item").forEach(b=>{
    b.classList.toggle("active",b.getAttribute("data-theme-set")===state.theme);
  });
}
function updateThemeTile(){
  const el=document.getElementById("tile-theme-sub");
  if(!el)return;
  if(state.theme==="auto")el.textContent=t("theme_auto");
  else if(state.theme==="dark")el.textContent=t("theme_dark");
  else el.textContent=t("theme_light");
}
function updateLangTile(){
  const meta=LANGS.find(l=>l.code===state.lang)||LANGS[0];
  document.getElementById("btn-flag").textContent=meta.flag;
  const sub=document.getElementById("tile-lang-sub");
  if(sub)sub.textContent=meta.flag+" "+meta.native;
}
function renderLangList(){
  const box=document.getElementById("lang-list");
  if(!box)return;
  box.innerHTML=LANGS.map(l=>{
    const orig=l.original?('<span class="badge-orig">'+t("original")+'</span>'):"";
    return '<button type="button" class="lang-item'+(l.code===state.lang?" active":"")+'" data-lang="'+l.code+'"><span class="flag">'+l.flag+'</span><span>'+l.native+'</span>'+orig+"</button>";
  }).join("");
  box.querySelectorAll("[data-lang]").forEach(b=>{
    b.onclick=()=>setLang(b.getAttribute("data-lang"));
  });
}
async function setLang(code){
  state.lang=code;
  try{localStorage.setItem("advinced_lang",code)}catch(e){}
  applyI18n();
  if(USER_ID){
    try{await apiPost("/api/miniapp/lang",{user_id:USER_ID,lang:code})}catch(e){}
  }
}
async function setTheme(theme){
  applyTheme(theme,true);
  if(USER_ID){
    try{await apiPost("/api/miniapp/theme",{user_id:USER_ID,theme:theme})}catch(e){}
  }
}

function show(id,push){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-"+id).classList.add("active");
  if(push!==false){
    if(state.history[state.history.length-1]!==id)state.history.push(id);
  }
  const back=document.getElementById("btn-back");
  if(id==="main")back.classList.remove("show");
  else back.classList.add("show");
  if(tg){
    try{
      if(id==="main")tg.BackButton.hide();
      else{tg.BackButton.show();tg.BackButton.onClick(goBack)}
    }catch(e){}
  }
}
function goBack(){
  if(state.history.length>1)state.history.pop();
  const prev=state.history[state.history.length-1]||"main";
  show(prev,false);
}

async function apiGet(path){
  const r=await fetch(API_BASE.replace(/\/$/,"")+path,{headers:{"Accept":"application/json"}});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
async function apiPost(path,body){
  const r=await fetch(API_BASE.replace(/\/$/,"")+path,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(body||{})});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
function fmt(n){return(Math.round(Number(n||0)*100)/100).toFixed(2)}

function setAvatar(){
  const letter=((tgUser&&(tgUser.first_name||tgUser.username))||"A").charAt(0).toUpperCase();
  document.getElementById("av-fb").textContent=letter;
  document.getElementById("p-av-fb").textContent=letter;
  const photo=tgUser&&tgUser.photo_url;
  const img=document.getElementById("av-img");
  const pimg=document.getElementById("p-av-img");
  if(photo){img.src=photo;img.style.display="block";document.getElementById("av-fb").style.display="none";pimg.src=photo;pimg.style.display="block";document.getElementById("p-av-fb").style.display="none"}
  const name=tgUser?[tgUser.first_name,tgUser.last_name].filter(Boolean).join(" ")||("ID "+tgUser.id):"Guest";
  document.getElementById("p-name").textContent=name;
  const un=document.getElementById("p-uname");
  if(tgUser&&tgUser.username){un.textContent="@"+tgUser.username;un.href="https://t.me/"+tgUser.username}
  else{un.textContent=USER_ID?("ID "+USER_ID):"—";un.removeAttribute("href")}
  document.getElementById("p-id").textContent=USER_ID||"—";
}

async function loadMe(){
  if(!USER_ID){document.getElementById("top-bal").textContent="0.00";return}
  try{
    const me=await apiGet("/api/miniapp/me?user_id="+encodeURIComponent(USER_ID));
    state.me=me;
    const bal=fmt(me.balance);
    document.getElementById("top-bal").textContent=bal;
    document.getElementById("bal-big").innerHTML=bal+"<span>₽</span>";
    document.getElementById("p-bal").textContent=bal+" ₽";
    // sync lang/theme from bot
    if(me.lang&&LANGS.some(l=>l.code===me.lang)){state.lang=me.lang;applyI18n()}
    if(me.theme==="dark"||me.theme==="light"||me.theme==="auto")applyTheme(me.theme,false);
    const role=Number(me.role||0);
    document.getElementById("p-role").textContent=roleName(role);
    const panel=document.getElementById("btn-panel");
    if(role>=ROLE_INTERN||me.is_staff)panel.style.display="";
    else panel.style.display="none";
  }catch(e){console.warn(e)}
}

async function loadRequests(){
  const box=document.getElementById("req-list");
  if(!USER_ID){box.innerHTML='<div class="empty">'+t("no_requests")+"</div>";return}
  try{
    const data=await apiGet("/api/miniapp/requests?user_id="+encodeURIComponent(USER_ID));
    const items=data.requests||[];
    if(!items.length){box.innerHTML='<div class="empty">'+t("no_requests")+"</div>";return}
    box.innerHTML=items.map(r=>{
      const st=r.status||"pending";
      const cls=st==="approved"||st==="completed"?"badge-completed":(st==="rejected"||st==="cancelled"?"badge-cancelled":"badge-pending");
      return '<div class="item"><div class="name">#'+r.id+' · '+(r.type||"")+' · '+fmt(r.amount)+' ₽</div><div class="sub"><span class="badge '+cls+'">'+st+'</span> · '+(r.method||"")+"</div></div>";
    }).join("");
  }catch(e){box.innerHTML='<div class="empty">—</div>'}
}

async function loadProjects(page){
  const list=document.getElementById("proj-list");
  const meta=document.getElementById("proj-meta");
  if(!USER_ID){list.innerHTML='<div class="empty">Telegram</div>';return}
  list.innerHTML='<div class="empty">…</div>';
  try{
    const data=await apiGet("/api/miniapp/projects?user_id="+encodeURIComponent(USER_ID)+"&page="+page);
    state.projPage=data.page||1;
    meta.textContent=(data.total||0)+" · "+state.projPage+"/"+(data.pages||1);
    const items=data.projects||[];
    if(!items.length){list.innerHTML='<div class="empty">—</div>';return}
    list.innerHTML=items.map(p=>'<div class="item" data-pid="'+p.id+'"><div class="name">'+(p.icon||"")+" "+(p.name||("#"+p.id))+'</div><div class="sub">'+(p.role||"")+" · "+(p.status||"")+"</div></div>").join("");
    list.querySelectorAll("[data-pid]").forEach(el=>el.onclick=()=>openProject(el.getAttribute("data-pid")));
  }catch(e){list.innerHTML='<div class="empty">err</div>'}
}
async function openProject(pid){
  show("project");
  document.getElementById("pd-title").textContent="#"+pid;
  document.getElementById("pd-body").textContent="…";
  try{
    const data=await apiGet("/api/miniapp/project/"+pid+"?user_id="+encodeURIComponent(USER_ID||0));
    const p=data.project||{};
    document.getElementById("pd-title").textContent=p.name||("#"+p.id);
    document.getElementById("pd-body").innerHTML="Status: <b>"+(p.status||"—")+"</b><br/>"+(p.role||"")+"<br/>"+(p.current_subs||0)+"/"+(p.target_subs||0);
  }catch(e){document.getElementById("pd-body").textContent=String(e.message||e)}
}

// init storage defaults
try{const s=localStorage.getItem("advinced_lang");if(s&&LANGS.some(l=>l.code===s))state.lang=s}catch(e){}
try{const s=localStorage.getItem("advinced_theme");if(s==="dark"||s==="light"||s==="auto")state.theme=s;else state.theme="light"}catch(e){}
applyTheme(state.theme,false);
applyI18n();
setAvatar();
loadMe();

// events
document.getElementById("btn-gear").onclick=()=>{show("settings");loadMe()};
document.getElementById("btn-flag").onclick=()=>{show("lang");renderLangList()};
document.getElementById("btn-top-bal").onclick=()=>{show("balance");loadMe();loadRequests()};
document.getElementById("btn-avatar").onclick=()=>{show("profile");loadMe()};
document.getElementById("btn-back").onclick=goBack;
document.getElementById("tile-lang").onclick=()=>{show("lang");renderLangList()};
document.getElementById("tile-theme").onclick=()=>show("theme");
document.querySelectorAll("[data-theme-set]").forEach(b=>b.onclick=()=>setTheme(b.getAttribute("data-theme-set")));
document.querySelectorAll("[data-nav]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const nav=btn.getAttribute("data-nav");
    if(nav==="balance"){show("balance");loadMe();loadRequests()}
    else if(nav==="settings"){show("settings");loadMe()}
    else if(nav==="projects"){show("projects");loadProjects(1)}
    else if(nav==="help")show("help");
    else if(nav==="support")show("support");
    else if(nav==="panel"){show("panel");loadPanel()}
  });
});
document.getElementById("btn-deposit").onclick=()=>show("deposit");
document.getElementById("btn-withdraw").onclick=()=>show("withdraw");
document.querySelectorAll("[data-dep-method]").forEach(b=>b.onclick=()=>{
  state.depMethod=b.getAttribute("data-dep-method");
  document.querySelectorAll("[data-dep-method]").forEach(x=>x.classList.toggle("primary",x===b));
});
document.querySelectorAll("[data-wd-method]").forEach(b=>b.onclick=()=>{
  state.wdMethod=b.getAttribute("data-wd-method");
  document.querySelectorAll("[data-wd-method]").forEach(x=>x.classList.toggle("primary",x===b));
});
document.getElementById("dep-submit").onclick=async()=>{
  const amount=parseFloat(document.getElementById("dep-amount").value||"0");
  const comment=document.getElementById("dep-comment").value||"";
  const info=document.getElementById("dep-info");
  try{
    const r=await apiPost("/api/miniapp/deposit",{user_id:USER_ID,amount,method:state.depMethod,comment});
    info.innerHTML="#"+r.request_id+(r.method==="crypto"?("<br/>"+r.crypto_address):("<br/>"+r.sbp_phone+" · "+r.sbp_bank));
    loadRequests();
  }catch(e){info.textContent=String(e.message||e)}
};
document.getElementById("wd-submit").onclick=async()=>{
  const amount=parseFloat(document.getElementById("wd-amount").value||"0");
  const recipient=document.getElementById("wd-recipient").value||"";
  const recipient_name=document.getElementById("wd-name").value||"";
  const info=document.getElementById("wd-info");
  try{
    const r=await apiPost("/api/miniapp/withdraw",{user_id:USER_ID,amount,method:state.wdMethod,recipient,recipient_name});
    info.textContent="#"+r.request_id+" · "+fmt(r.amount)+" ₽";
    loadMe();loadRequests();
  }catch(e){info.textContent=String(e.message||e)}
};
document.getElementById("proj-prev").onclick=()=>{if(state.projPage>1)loadProjects(state.projPage-1)};
document.getElementById("proj-next").onclick=()=>loadProjects(state.projPage+1);
document.querySelectorAll("[data-panel]").forEach(b=>b.onclick=()=>{
  const body=document.getElementById("panel-body");
  body.style.display="block";
});

async function loadPanel(){
  if(!USER_ID)return;
  try{
    const p=await apiGet("/api/miniapp/panel?user_id="+encodeURIComponent(USER_ID));
    document.getElementById("panel-role").textContent=p.role_name||roleName(p.role);
  }catch(e){document.getElementById("panel-role").textContent="—"}
}

// periodic sync from bot (theme/lang)
setInterval(async()=>{
  if(!USER_ID)return;
  try{
    const me=await apiGet("/api/miniapp/me?user_id="+encodeURIComponent(USER_ID));
    if(me.lang&&me.lang!==state.lang&&LANGS.some(l=>l.code===me.lang)){state.lang=me.lang;applyI18n()}
    if(me.theme&&me.theme!==state.theme)applyTheme(me.theme,false);
    document.getElementById("top-bal").textContent=fmt(me.balance);
  }catch(e){}
},15000);

window.AdvincedAPI={API_BASE,USER_ID,setLang,setTheme};
</script>
</body>
</html>
