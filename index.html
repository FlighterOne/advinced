<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Advinced Management</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f1115);
      --sec: var(--tg-theme-secondary-bg-color, #1a1d24);
      --text: var(--tg-theme-text-color, #f2f4f8);
      --hint: var(--tg-theme-hint-color, #8b93a7);
      --btn: var(--tg-theme-button-color, #2aabee);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --line: rgba(255,255,255,0.08);
      --card: rgba(255,255,255,0.04);
      --ok: #3dd68c;
      --err: #ff6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .wrap {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 20px;
    }
    .spacer { flex: 1; min-height: 12px; }
    .api-status {
      font-size: 11px;
      color: var(--hint);
      text-align: center;
      margin-bottom: 8px;
      opacity: 0.85;
    }
    .api-status.ok { color: var(--ok); }
    .api-status.err { color: var(--err); }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 52px; padding: 12px 14px; border-radius: 14px;
      border: 1px solid var(--line); background: var(--sec); color: var(--text);
      font-size: 15px; font-weight: 600; cursor: pointer; text-align: center;
    }
    .btn:active { transform: scale(0.98); opacity: .9; }
    .btn.wide { grid-column: 1 / -1; }
    .screen { display: none; flex: 1; flex-direction: column; }
    .screen.active { display: flex; }
    .header {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .muted { color: var(--hint); font-size: 13px; line-height: 1.4; }
    .balance-big { font-size: 28px; font-weight: 700; margin: 8px 0 4px; }
    .list { display: grid; gap: 8px; margin: 8px 0; }
    .item {
      background: var(--sec); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; cursor: pointer; font-size: 14px; font-weight: 600;
    }
    .item .sub { display: block; margin-top: 4px; font-weight: 400; color: var(--hint); font-size: 12px; }
    .loading { text-align: center; color: var(--hint); padding: 16px; font-size: 14px; }
    .pager { display: flex; gap: 8px; margin-top: 8px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px; margin-bottom: 10px;
    }
    .nav-bottom { margin-top: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- MAIN: только кнопки внизу -->
    <div id="screen-main" class="screen active">
      <div class="spacer"></div>
      <div class="api-status" id="api-status">API…</div>
      <div class="nav-bottom grid">
        <button class="btn" data-nav="balance">💵 Баланс</button>
        <button class="btn" data-nav="settings">⚙️ Настройки</button>
        <button class="btn wide" data-nav="projects">📂 Проекты</button>
        <button class="btn" data-nav="help">❓ Помощь</button>
        <button class="btn" data-nav="support">💬 Поддержка</button>
        <button class="btn wide" data-nav="panel" id="btn-panel" style="display:none">🛠 Панель</button>
      </div>
    </div>

    <div id="screen-balance" class="screen">
      <div class="header">
        <div class="title">💵 Баланс</div>
        <div class="balance-big" id="bal-big">— ₽</div>
        <div class="muted">ID: <span id="uid">—</span></div>
      </div>
      <div class="spacer"></div>
      <div class="nav-bottom grid">
        <button class="btn wide" data-nav="main">⬅️ Назад</button>
      </div>
    </div>

    <div id="screen-projects" class="screen">
      <div class="header">
        <div class="title">📂 Проекты</div>
        <div class="muted" id="proj-meta">—</div>
      </div>
      <div class="list" id="proj-list"></div>
      <div class="pager">
        <button class="btn" id="proj-prev">⬅️</button>
        <button class="btn" id="proj-next">➡️</button>
      </div>
      <div class="spacer"></div>
      <div class="nav-bottom grid">
        <button class="btn wide" data-nav="main">⬅️ Назад</button>
      </div>
    </div>

    <div id="screen-project" class="screen">
      <div class="header">
        <div class="title" id="pd-title">—</div>
        <div class="muted" id="pd-body">—</div>
      </div>
      <div class="spacer"></div>
      <div class="nav-bottom grid">
        <button class="btn wide" data-nav="projects">⬅️ К проектам</button>
        <button class="btn wide" data-nav="main">🏠 Меню</button>
      </div>
    </div>

    <div id="screen-settings" class="screen">
      <div class="header">
        <div class="title">⚙️ Настройки</div>
      </div>
      <div class="card muted">Язык: <b id="set-lang">—</b></div>
      <div class="card muted">Тема: <b id="set-theme">—</b></div>
      <div class="card muted">Роль: <b id="set-role">—</b></div>
      <div class="spacer"></div>
      <div class="nav-bottom grid">
        <button class="btn wide" data-nav="main">⬅️ Назад</button>
      </div>
    </div>

    <div id="screen-help" class="screen">
      <div class="header">
        <div class="title">❓ Помощь</div>
      </div>
      <div class="card muted">Данные синхронизированы с ботом через API Amvera.<br/>API: <span id="help-api"></span></div>
      <div class="spacer"></div>
      <div class="nav-bottom grid">
        <button class="btn wide" data-nav="main">⬅️ Назад</button>
      </div>
    </div>

    <div id="screen-support" class="screen">
      <div class="header">
        <div class="title">💬 Поддержка</div>
      </div>
      <div class="card muted">Напишите в бота или администратору.</div>
      <div class="spacer"></div>
      <div class="nav-bottom grid">
        <button class="btn wide" data-nav="main">⬅️ Назад</button>
      </div>
    </div>

    <div id="screen-panel" class="screen">
      <div class="header">
        <div class="title">🛠 Панель</div>
        <div class="muted">Доступна стажёр+. Полное управление — в Telegram-боте.</div>
      </div>
      <div class="spacer"></div>
      <div class="nav-bottom grid">
        <button class="btn wide" data-nav="main">⬅️ Назад</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://advinced-bot5.waw0.amvera.tech";
    const ROLE_NAMES = {
      0: "Пользователь", 1: "Партнер", 2: "Корпоративный",
      3: "Стажер", 4: "Модератор", 5: "Админ", 6: "Владелец"
    };
    const ROLE_INTERN = 3;

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      try { tg.ready(); tg.expand(); } catch (e) {}
    }
    const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
    const USER_ID = user ? user.id : null;

    document.getElementById("uid").textContent = USER_ID || "—";
    document.getElementById("help-api").textContent = API_BASE;

    async function apiGet(path) {
      const url = API_BASE.replace(/\/$/, "") + path;
      const r = await fetch(url, { headers: { "Accept": "application/json" } });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }

    let me = null, projPage = 1;

    function show(id) {
      document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      if (tg) {
        try {
          if (id === "screen-main") tg.BackButton.hide();
          else {
            tg.BackButton.show();
            tg.BackButton.onClick(() => show(id === "screen-project" ? "screen-projects" : "screen-main"));
          }
        } catch (e) {}
      }
    }

    async function loadMe() {
      if (!USER_ID) return;
      try {
        me = await apiGet("/api/miniapp/me?user_id=" + encodeURIComponent(USER_ID));
        const bal = Number(me.balance || 0);
        document.getElementById("bal-big").textContent = bal.toFixed(2) + " ₽";
        document.getElementById("set-lang").textContent = me.lang || "ru";
        document.getElementById("set-theme").textContent = me.theme || "auto";
        const role = Number(me.role || 0);
        document.getElementById("set-role").textContent = ROLE_NAMES[role] || String(role);
        // панель: стажёр+ (role >= 3)
        if (role >= ROLE_INTERN || me.is_staff) {
          document.getElementById("btn-panel").style.display = "";
        }
      } catch (e) {
        console.warn(e);
      }
    }

    async function loadProjects(page) {
      const list = document.getElementById("proj-list");
      const meta = document.getElementById("proj-meta");
      if (!USER_ID) {
        list.innerHTML = '<div class="loading">Откройте из Telegram-бота</div>';
        return;
      }
      list.innerHTML = '<div class="loading">Загрузка…</div>';
      try {
        const data = await apiGet("/api/miniapp/projects?user_id=" + encodeURIComponent(USER_ID) + "&page=" + page);
        projPage = data.page || 1;
        meta.textContent = "Всего: " + (data.total || 0) + " · " + projPage + "/" + (data.pages || 1);
        const items = data.projects || [];
        if (!items.length) {
          list.innerHTML = '<div class="loading">Нет проектов</div>';
          return;
        }
        list.innerHTML = items.map((p) => {
          const role = p.role === "advertiser" ? "покупка" : (p.role === "partner" ? "партнёр" : "продажа");
          return '<div class="item" data-pid="' + p.id + '">' +
            (p.icon || "•") + " " + (p.name || ("#" + p.id)) +
            '<span class="sub">' + role + " · " + (p.status || "") + "</span></div>";
        }).join("");
        list.querySelectorAll("[data-pid]").forEach((el) => {
          el.addEventListener("click", () => openProject(el.getAttribute("data-pid")));
        });
      } catch (e) {
        list.innerHTML = '<div class="loading">Ошибка загрузки</div>';
        meta.textContent = String(e.message || e);
      }
    }

    async function openProject(pid) {
      show("screen-project");
      document.getElementById("pd-title").textContent = "#" + pid;
      document.getElementById("pd-body").textContent = "Загрузка…";
      try {
        const q = USER_ID ? ("?user_id=" + encodeURIComponent(USER_ID)) : "";
        const data = await apiGet("/api/miniapp/project/" + pid + q);
        const p = data.project || {};
        document.getElementById("pd-title").textContent = p.name || ("#" + p.id);
        document.getElementById("pd-body").innerHTML =
          "Статус: <b>" + (p.status || "—") + "</b><br/>Роль: <b>" + (p.role || "—") + "</b><br/>" +
          "Подписки: <b>" + (p.current_subs || 0) + "/" + (p.target_subs || 0) + "</b><br/>" +
          "Сниппет: <b>" + (p.snippet_status || "none") + "</b>";
      } catch (e) {
        document.getElementById("pd-body").textContent = "Ошибка: " + (e.message || e);
      }
    }

    (async function ping() {
      const el = document.getElementById("api-status");
      try {
        const d = await apiGet("/api/health");
        el.textContent = d && d.ok ? "API: онлайн" : "API: ok";
        el.classList.add("ok");
      } catch (e) {
        el.textContent = "API: нет связи";
        el.classList.add("err");
      }
    })();

    loadMe();

    document.querySelectorAll("[data-nav]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const nav = btn.getAttribute("data-nav");
        if (nav === "main") return show("screen-main");
        if (nav === "balance") { show("screen-balance"); loadMe(); return; }
        if (nav === "projects") { show("screen-projects"); loadProjects(1); return; }
        if (nav === "settings") { show("screen-settings"); loadMe(); return; }
        if (nav === "help") return show("screen-help");
        if (nav === "support") return show("screen-support");
        if (nav === "panel") return show("screen-panel");
      });
    });
    document.getElementById("proj-prev").onclick = () => { if (projPage > 1) loadProjects(projPage - 1); };
    document.getElementById("proj-next").onclick = () => loadProjects(projPage + 1);

    window.AdvincedAPI = { API_BASE, apiGet, USER_ID };
  </script>
</body>
</html>
